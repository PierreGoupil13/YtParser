[project]
name = "ytparser"
version = "0.1.0"
description = "Split YouTube music compilations into tagged audio tracks."
readme = "README.md"
authors = [
    { name = "PierreGoupil13", email = "p.goupil356@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
ytparser = "ytparser.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
